# Builds VideoSift on every push/PR and uploads the zipped app as a workflow artifact.
# Pushing a tag like "v1.1" or "v1.1.2" also stamps that version into the exe
# and publishes a GitHub release with the zip attached.
#
#   git tag v1.1
#   git push origin v1.1

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used by the release step (tags)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "Tag must look like v1.2 or v1.2.3, got '${{ github.ref_name }}'" }
          $parts = [System.Collections.Generic.List[string]]$v.Split('.')
          while ($parts.Count -lt 4) { $parts.Add('0') }
          $full = $parts -join '.'
          $file = 'Properties/AssemblyInfo.cs'
          (Get-Content $file -Raw) -replace '(Assembly(File)?Version\( ")[^"]+', "`${1}$full" | Set-Content $file -NoNewline
          Select-String -Path $file -Pattern 'Version\('

      - name: Build
        run: dotnet build VideoSift.csproj -c Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          $name = "VideoSift-$ver-win-x64"
          $stage = "dist/VideoSift"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item bin/Release/net48/* $stage -Recurse
          Get-ChildItem $stage -Recurse -Include *.pdb, Settings.xml | Remove-Item
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/VideoSift

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/${{ steps.package.outputs.name }}.zip" --title "VideoSift ${{ github.ref_name }}" --generate-notes
